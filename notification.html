<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Notifications</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
}

.proof-popup{
    position:fixed;
    bottom:20px;
    left:20px;
    background:#111;
    color:#fff;
    padding:15px 20px;
    border-radius:12px;
    max-width:320px;
    box-shadow:0 4px 15px rgba(0,0,0,.4);
    border-left:4px solid #00d4ff;
    z-index:9999;
    animation:slideIn .5s ease;
}

.proof-popup strong{
    color:#00d4ff;
}

@keyframes slideIn{
    from{
        transform:translateX(-100%);
        opacity:0;
    }
    to{
        transform:translateX(0);
        opacity:1;
    }
}
</style>
</head>
<body>

<div id="proof-popup" class="proof-popup"></div>

<script>
const notifications = [
    "Aisha from Kano just activated an account",
    "David from Abuja just joined Glamour",
    "Mary from Lagos just activated an account",
    "John from Port Harcourt just joined Glamour",
    "Fatima from Kaduna just activated an account",
    "Ibrahim from Sokoto just joined Glamour",
    "Grace from Enugu just activated an account",
    "Samuel from Benin City just joined Glamour",
    "Chinedu from Onitsha just activated an account",
    "Esther from Uyo just joined Glamour",
    "Emeka from Owerri just activated an account",
    "Blessing from Asaba just joined Glamour",
    "Ahmed from Maiduguri just activated an account",
    "Joy from Warri just joined Glamour",
    "Michael from Jos just activated an account",
    "Peace from Calabar just joined Glamour",
    "Daniel from Abeokuta just activated an account",
    "Ruth from Akure just joined Glamour",
    "Kelvin from Yenagoa just activated an account",
    "Mercy from Ilorin just joined Glamour"
];

const popup = document.getElementById("proof-popup");

function showNotification(){
    const notification =
        notifications[Math.floor(Math.random() * notifications.length)];

    const mins = Math.floor(Math.random() * 15) + 1;

    popup.innerHTML = `
        <strong>${notification.split(" ")[0]}</strong>
        ${notification.substring(notification.indexOf(" "))}
        <br><small>• ${mins} mins ago</small>
    `;
}

showNotification();
setInterval(showNotification, 5000);
</script>

</body>
</html>
