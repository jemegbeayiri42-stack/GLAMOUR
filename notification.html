<!-- Live Notification Popup -->
<div id="proof-popup"></div>

<style>
#proof-popup {
    position: fixed;
    bottom: 20px;
    left: 20px;
    background: #111;
    color: white;
    padding: 15px;
    border-radius: 12px;
    max-width: 320px;
    font-family: Arial, sans-serif;
    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    border-left: 4px solid #00d4ff;
    z-index: 9999;
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.5s ease;
}

#proof-popup.show {
    opacity: 1;
    transform: translateY(0);
}

#proof-popup strong {
    color: #00d4ff;
}

#proof-popup small {
    color: #bbb;
}
</style>

<script>
const notifications = [
    "Aisha from Kano just activated Glamour",
    "David from Abuja just joined Glamour",
    "Mary from Lagos just activated Glamour",
    "John from Port Harcourt just joined Glamour",
    "Fatima from Kaduna just activated Glamour",
    "Ibrahim from Sokoto just joined Glamour",
    "Grace from Enugu just activated Glamour",
    "Samuel from Benin City just joined Glamour",
    "Chinedu from Onitsha just activated Glamour",
    "Esther from Uyo just joined Glamour",
    "Emeka from Owerri just activated Glamour",
    "Blessing from Asaba just joined Glamour",
    "Ahmed from Maiduguri just activated Glamour",
    "Joy from Warri just joined Glamour",
    "Michael from Jos just activated Glamour",
    "Peace from Calabar just joined Glamour",
    "Daniel from Abeokuta just activated Glamour",
    "Ruth from Akure just joined Glamour",
    "Kelvin from Yenagoa just activated Glamour",
    "Mercy from Ilorin just joined Glamour",
    "Victor from Lokoja just activated Glamour",
    "Jennifer from Awka just joined Glamour",
    "Collins from Aba just activated Glamour",
    "Sarah from Minna just joined Glamour",
    "Emmanuel from Katsina just activated Glamour"
];

const popup = document.getElementById("proof-popup");

function showNotification() {
    const notification =
        notifications[Math.floor(Math.random() * notifications.length)];

    const mins = Math.floor(Math.random() * 15) + 1;

    const firstName = notification.split(" ")[0];

    popup.innerHTML = `
        <strong>${firstName}</strong>
        ${notification.substring(notification.indexOf(" "))}
        <br>
        <small>• ${mins} mins ago</small>
    `;

    popup.classList.add("show");

    setTimeout(() => {
        popup.classList.remove("show");
    }, 4500);
}

showNotification();
setInterval(showNotification, 6000);
</script>
